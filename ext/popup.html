<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pawang Layar</title>
<link rel="stylesheet" href="../css/guard.css">
<style>
  :root {
    color-scheme: light dark;
    --bg: #F6F1E6; --card: #EFE8D8; --ink: #1B1D17; --muted: #656B5E;
    --line: #DCD3BF; --go: #F06A1E; --go-ink: #FFFDF8; --accent: #F3C48E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13160F; --card: #1C2017; --ink: #EDEFE7; --muted: #939B89; --line: #2C3225;
    }
  }
  * { box-sizing: border-box; scrollbar-width: none }
  *::-webkit-scrollbar { display: none; width: 0; height: 0 }
  body {
    width: 384px; margin: 0; padding: 12px 14px 14px; background: var(--bg); color: var(--ink);
    font-family: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 13px; line-height: 1.4; user-select: none; overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer }

  .top {
    position: relative; height: 126px; border-radius: 16px; overflow: hidden;
    background: radial-gradient(95% 85% at 50% 105%, var(--accent), var(--card) 76%);
    border: 1px solid rgba(0, 0, 0, .06); margin-bottom: 10px;
  }
  .top-meta {
    position: relative; z-index: 3; display: flex; justify-content: space-between; align-items: flex-start;
    padding: 9px 12px; pointer-events: none;
  }
  .top-title { margin: 0; font-weight: 800; font-size: 15px; line-height: 1.1 }
  .top-sub { margin: 2px 0 0; font-size: 11px; color: var(--muted) }
  .top-badge {
    font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px;
    background: rgba(255, 255, 255, .55); color: #1B1D17; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .top-stage {
    position: absolute; left: 50%; bottom: 0; translate: -50% 0;
    width: 122px; height: 122px; z-index: 1;
  }
  .top .bubble { font-size: 12px; padding: 6px 10px; max-width: 210px }

  .status-box {
    background: var(--card); border: 1.5px solid var(--go); border-radius: 14px;
    padding: 10px 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .status-box[hidden] { display: none }
  .status-info b { display: block; font-size: 14px; font-variant-numeric: tabular-nums }
  .status-info span { font-size: 11.5px; color: var(--muted) }
  .status-btns { display: flex; gap: 6px }
  .btn-sm {
    border: 1px solid var(--line); background: var(--bg); padding: 6px 10px;
    border-radius: 99px; font-weight: 600; font-size: 12px;
  }
  .btn-sm.primary { background: var(--go); color: var(--go-ink); border-color: var(--go) }

  .sec-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 8px 0 5px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .sec-label #pTag {
    text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 11.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pets {
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px;
  }
  .pet {
    background: var(--card); border: 1.5px solid transparent; border-radius: 11px;
    padding: 4px 2px 5px; text-align: center; display: flex; flex-direction: column; align-items: center;
  }
  .pet:hover { border-color: var(--line) }
  .pet[aria-pressed="true"] { border-color: var(--go); background: color-mix(in srgb, var(--go) 10%, var(--card)) }
  .pet-art { width: 34px; height: 34px; pointer-events: none }
  .pet b { font-size: 10px; font-weight: 600; line-height: 1.1; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100% }

  .chips { display: flex; flex-wrap: wrap; gap: 5px }
  .chip {
    background: var(--card); border: 1.5px solid transparent; border-radius: 99px;
    padding: 5px 10px; font-weight: 600; font-size: 12px;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
  /* ---------- sandi ---------- */
  .ico { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  .lock {
    display: flex; align-items: center; gap: 6px;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 99px;
    padding: 0 13px; font-weight: 600; font-size: 12.5px; color: var(--muted);
  }
  .lock:hover { color: var(--ink) }
  .lock .i-on { display: none }
  .lock[aria-pressed="true"] {
    color: var(--go); border-color: var(--go); background: color-mix(in srgb, var(--go) 12%, var(--card));
  }
  .lock[aria-pressed="true"] .i-on { display: block }
  .lock[aria-pressed="true"] .i-off { display: none }

  .pin-row { display: flex; gap: 6px; align-items: stretch; margin-top: 10px; height: 40px }
  .pin-row[hidden], .actions[hidden] { display: none }
  .pin-field {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 99px;
    padding: 0 6px 0 13px; color: var(--muted); cursor: text;
  }
  .pin-field:focus-within { border-color: var(--go); color: var(--go) }
  .pin-in {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: none; padding: 0;
    color: var(--ink); font: inherit; font-size: 13px; user-select: text;
    -webkit-text-security: disc;
  }
  .pin-in.reveal { -webkit-text-security: none }
  .pin-in::placeholder { color: var(--muted); -webkit-text-security: none }
  .pin-ico-btn {
    display: grid; place-items: center; width: 28px; height: 28px; flex: none;
    background: transparent; border: 0; border-radius: 50%; color: var(--muted);
  }
  .pin-ico-btn:hover { background: color-mix(in srgb, var(--ink) 9%, transparent); color: var(--ink) }
  .pin-ico-btn[hidden] { display: none }
  .pin-ico-btn .i-on { display: none }
  .pin-ico-btn[aria-pressed="true"] .i-on { display: block }
  .pin-ico-btn[aria-pressed="true"] .i-off { display: none }
  .pin-ok {
    background: var(--go); color: var(--go-ink); border: 0; border-radius: 99px;
    padding: 0 16px; font-weight: 700; font-size: 13px;
  }
  .pin-ok.ghost { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); font-weight: 600 }
  .pin-row.err .pin-field { border-color: #E5484D; color: #E5484D; animation: nudge .35s }
  @keyframes nudge { 20%, 60% { transform: translateX(-5px) } 40%, 80% { transform: translateX(5px) } }
  @media (prefers-reduced-motion: reduce) { .pin-row.err .pin-field { animation: none } }
  .status-box .pin-row { margin: 0; flex: 1; height: 34px }
  .status-box.asking .status-info, .status-box.asking .status-btns { display: none }

  .actions { display: flex; gap: 6px; margin-top: 10px; height: 40px }
  .go {
    flex: 1; background: var(--go); color: var(--go-ink); border: 0; border-radius: 99px;
    padding: 0 16px; font-weight: 700; font-size: 14px; white-space: nowrap;
  }
  .go:hover { filter: brightness(1.05) }
  .toggle {
    background: var(--card); border: 1.5px solid var(--line); border-radius: 99px;
    width: 40px; padding: 0; flex: none; display: grid; place-items: center;
  }
  .toggle .ico { width: 17px; height: 17px }
  .toggle:hover { border-color: var(--muted) }
  .toggle .i-off { display: none }
  .toggle[aria-pressed="false"] { color: var(--muted) }
  .toggle[aria-pressed="false"] .i-off { display: block }
  .toggle[aria-pressed="false"] .i-on { display: none }
  .pin-x {
    width: 40px; flex: none; display: grid; place-items: center; padding: 0;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 99px; color: var(--muted);
  }
  .pin-x:hover { color: var(--ink); border-color: var(--muted) }
  .pop-foot {
    display: flex; justify-content: center; align-items: center;
    margin-top: 9px; padding-top: 7px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--muted);
  }
  .pop-foot a { color: var(--ink); font-weight: 600; text-decoration: none }
  .pop-foot a:hover { color: var(--go); text-decoration: underline }
</style>

<!-- inti + semua karakter: daftarnya ada di js/pawang.js -->
<script src="../js/pawang.js"></script>
<script src="popup.js" defer></script>
</head>
<body>

<div class="top" id="panel">
  <div class="top-meta">
    <div>
      <p class="top-title" id="pName">Oyen</p>
      <p class="top-sub" id="pSpecies">Kucing oren</p>
    </div>
    <span class="top-badge">Transparan</span>
  </div>
  <div class="top-stage"><div class="slot" id="hSlot"></div></div>
  <div class="bubble" id="hBubble" aria-live="polite"></div>
  <div class="fx-layer" id="hFx"></div>
</div>

<div class="status-box" id="statusBox" hidden>
  <div class="status-info">
    <span id="stLabel">Sedang bertugas</span>
    <b id="stClock">0:00</b>
  </div>
  <div class="status-btns">
    <button type="button" class="btn-sm primary" id="stNow" hidden>Sekarang</button>
    <button type="button" class="btn-sm" id="stStop">Hentikan</button>
  </div>
  <form class="pin-row" id="unlock" hidden>
    <label class="pin-field">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <input class="pin-in" id="unlockIn" type="text" placeholder="Sandi untuk mengakhiri" aria-label="Sandi untuk mengakhiri" maxlength="32" autocomplete="off" spellcheck="false">
    </label>
    <button type="submit" class="pin-ok">Buka</button>
    <button type="button" class="pin-ok ghost" id="unlockCancel">Batal</button>
  </form>
</div>

<div class="sec-label"><span>Pilih Penjaga</span><span id="pTag"></span></div>
<div class="pets" id="pets"></div>

<div class="sec-label"><span>Durasi Istirahat</span></div>
<div class="chips" id="dur"></div>

<div class="sec-label"><span>Jadwal</span></div>
<div class="chips" id="when"></div>

<div class="actions" id="actions">
  <button class="go" id="go" type="button">Mulai jaga</button>
  <button class="lock" id="lockBtn" type="button" aria-pressed="false" title="Kunci dengan sandi: tanpa sandi ini, istirahat tidak bisa dihentikan lebih awal">
    <svg class="ico i-off" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg>
    <svg class="ico i-on" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <span id="lockLbl">Sandi</span>
  </button>
  <button class="toggle" id="sound" type="button" aria-pressed="true" aria-label="Suara" title="Suara nyala (klik untuk mematikan)">
    <svg class="ico i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.2 6.3a8 8 0 0 1 0 11.4"/></svg>
    <svg class="ico i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
</div>

<form class="pin-row" id="pinEdit" hidden>
  <label class="pin-field">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <input class="pin-in" id="pin" type="text" placeholder="Sandi untuk berhenti" aria-label="Sandi untuk berhenti lebih awal" maxlength="32" autocomplete="off" spellcheck="false">
    <button class="pin-ico-btn" id="pinEye" type="button" aria-pressed="false" aria-label="Tampilkan sandi" title="Tampilkan sandi">
      <svg class="ico i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="ico i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
    </button>
  </label>
  <button type="submit" class="pin-ok" id="pinOk">Simpan</button>
  <button class="pin-x" id="pinBack" type="button" aria-label="Batal, kembali" title="Batal, kembali">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</form>

<div class="pop-foot">
  <span>Built by <a href="https://yumastudio.digital/" target="_blank" rel="noopener noreferrer">yumastudio.digital</a></span>
</div>

</body>
</html>
